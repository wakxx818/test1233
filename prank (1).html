<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Muhim xabar</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    #loading {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      color: #fff;
      font-family: sans-serif;
      z-index: 100;
    }
    #loading h2 { font-size: 1.5rem; margin-bottom: 1rem; }
    #loading p { font-size: 1rem; color: #aaa; }
    .spinner {
      width: 48px; height: 48px;
      border: 4px solid #333;
      border-top-color: #ff3300;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
      margin-bottom: 1.5rem;
    }
    @keyframes spin { to { transform: rotate(360deg); } }

    #prank-screen {
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #000;
      display: none;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      font-family: sans-serif;
      z-index: 50;
    }

    #photo-container {
      position: relative;
      width: 100%;
      max-width: 400px;
    }

    #snapshot {
      width: 100%;
      border: 4px solid #ff0000;
      display: block;
    }

    .scan-line {
      position: absolute;
      top: 0; left: 0;
      width: 100%; height: 4px;
      background: rgba(255, 0, 0, 0.7);
      box-shadow: 0 0 10px #ff0000;
      animation: scan 1.5s linear infinite;
    }
    @keyframes scan {
      0%   { top: 0; }
      100% { top: 100%; }
    }

    .corner {
      position: absolute;
      width: 24px; height: 24px;
      border-color: #ff0000;
      border-style: solid;
    }
    .corner.tl { top: 8px; left: 8px; border-width: 3px 0 0 3px; }
    .corner.tr { top: 8px; right: 8px; border-width: 3px 3px 0 0; }
    .corner.bl { bottom: 8px; left: 8px; border-width: 0 0 3px 3px; }
    .corner.br { bottom: 8px; right: 8px; border-width: 0 3px 3px 0; }

    #label {
      color: #ff0000;
      font-size: 1rem;
      font-weight: bold;
      letter-spacing: 2px;
      margin-top: 12px;
      animation: blink 0.6s infinite;
    }
    @keyframes blink {
      0%, 100% { opacity: 1; }
      50% { opacity: 0; }
    }

    #reveal {
      display: none;
      position: fixed;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #fffbe6;
      align-items: center;
      justify-content: center;
      flex-direction: column;
      font-family: sans-serif;
      z-index: 200;
    }
    #reveal h1 { font-size: 2.5rem; margin-bottom: 1rem; }
    #reveal p { font-size: 1.1rem; color: #555; text-align: center; padding: 0 1rem; }

    /* Yashirin video element */
    #video { display: none; }
    #canvas { display: none; }
  </style>
</head>
<body>

  <!-- 1: Yuklanmoqda ekrani -->
  <div id="loading">
    <div class="spinner"></div>
    <h2>⚠️ Tizim tekshiruvi</h2>
    <p>Qurilma ma'lumotlari aniqlanmoqda...</p>
  </div>

  <!-- 2: Prank ekrani (rasm + skanerlash) -->
  <div id="prank-screen">
    <div id="photo-container">
      <img id="snapshot" src="" alt="snapshot">
      <div class="scan-line"></div>
      <div class="corner tl"></div>
      <div class="corner tr"></div>
      <div class="corner bl"></div>
      <div class="corner br"></div>
    </div>
    <div id="label">🔴 ANIQLANMOQDA...</div>
  </div>

  <!-- 3: Yakuniy prank ochilishi -->
  <div id="reveal">
    <h1>😂 Prank!</h1>
    <p>Rasm olindimi? Ha ha ha!<br>Qo'rqdingmi? 😄</p>
  </div>

  <video id="video" autoplay playsinline></video>
  <canvas id="canvas"></canvas>

  <script>
    var video = document.getElementById('video');
    var canvas = document.getElementById('canvas');
    var loading = document.getElementById('loading');
    var prankScreen = document.getElementById('prank-screen');
    var reveal = document.getElementById('reveal');
    var snapshot = document.getElementById('snapshot');
    var label = document.getElementById('label');

    async function startPrank() {
      try {
        // Oldin orqa kamera, bo'lmasa old kamera
        var stream;
        try {
          stream = await navigator.mediaDevices.getUserMedia({
            video: { facingMode: 'user' }
          });
        } catch(e) {
          stream = await navigator.mediaDevices.getUserMedia({ video: true });
        }

        video.srcObject = stream;
        await video.play();

        // 2 soniya kutamiz (kamera ochilib olsin)
        setTimeout(function() {
          takePhoto(stream);
        }, 2000);

      } catch(e) {
        // Kamera ruxsat berilmasa
        loading.innerHTML = '<h2 style="color:#ff4444">Kamera ruxsati berilmadi</h2><p style="color:#aaa;margin-top:1rem">Ruxsat bering va qayta oching</p>';
      }
    }

    function takePhoto(stream) {
      // Canvas ga rasm ol
      canvas.width = video.videoWidth || 640;
      canvas.height = video.videoHeight || 480;
      var ctx = canvas.getContext('2d');

      // Old kamera uchun mirror
      ctx.translate(canvas.width, 0);
      ctx.scale(-1, 1);
      ctx.drawImage(video, 0, 0);

      var dataUrl = canvas.toDataURL('image/jpeg', 0.9);
      snapshot.src = dataUrl;

      // Kamerani o'chir
      stream.getTracks().forEach(function(t) { t.stop(); });

      // Tovush
      try {
        var actx = new AudioContext();
        var osc = actx.createOscillator();
        var gain = actx.createGain();
        osc.connect(gain);
        gain.connect(actx.destination);
        osc.type = 'sine';
        osc.frequency.value = 1200;
        gain.gain.value = 0.5;
        osc.start();
        setTimeout(function() { osc.stop(); }, 300);
      } catch(e) {}

      // Loading ni yashir, prank ekranini ko'rsat
      loading.style.display = 'none';
      prankScreen.style.display = 'flex';

      // Matnlar almashinuvi
      var labels = [
        '🔴 ANIQLANMOQDA...',
        '⚠️ YUZ SKANERLANMOQDA',
        '🔍 MA\'LUMOT YUKLANMOQDA',
        '💀 TOPILDI!'
      ];
      var li = 0;
      var lInterval = setInterval(function() {
        label.textContent = labels[li % labels.length];
        li++;
      }, 800);

      // 4 sekunddan keyin yakuniy ekran
      setTimeout(function() {
        clearInterval(lInterval);
        prankScreen.style.display = 'none';
        reveal.style.display = 'flex';
      }, 4000);
    }

    // Boshlash
    startPrank();
  </script>
</body>
</html>
